<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David 的 AI 學習筆記</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="menu-anchor">
      <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu"><span aria-hidden="true">☰</span> 主選單</button>
      <nav id="main-menu" class="main-menu" aria-label="主選單" hidden>
        <h2>主選單</h2>
        <p>每次點擊依序切換：紅、橙、黃、綠、藍、紫。</p>
        <button class="color-option" type="button" data-color="green">選項一 · 綠</button>
        <button class="color-option" type="button" data-color="green">選項二 · 綠</button>
        <button class="color-option" type="button" data-color="green">選項三 · 綠</button>
      </nav>
    </div>
    <span class="site-name">David 的 AI 學習筆記</span>
  </header>
  <main class="card">
    <span class="tag">DIRECTOR × CODEX</span>
    <h1>David 的 AI 學習筆記</h1>
    <p class="intro">你好，我是 David。<br>我負責定目標，讓 Codex 把想法變成作品。</p>
    <div class="steps" aria-label="合作流程">
      <span>01 定目標</span><span>02 看進度</span><span>03 驗收成果</span>
    </div>
    <button id="hello" type="button">跟我打聲招呼</button>
    <p id="message" class="message" role="status" aria-live="polite">按下按鈕，試試你的第一個互動。</p>
    <footer>從一個小作品開始，學會指揮 AI。</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
